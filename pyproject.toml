[project]
name = "fanscan"
version = "0.1.0"
description = "Centrifugal fan impeller shape analysis from photographs -> parameters -> STEP"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "scipy>=1.14",
  "cadquery>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fanscan = "fanscan.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fanscan*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
